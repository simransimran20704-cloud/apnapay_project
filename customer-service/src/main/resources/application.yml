server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:file:./data/customer_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
